# Managed by repokeeper (https://github.com/vannt-dev/repokeeper). Edits are reported by `repokeeper check`.
pre-commit:
  parallel: true
  jobs:
    - name: node:biome
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,json,jsonc,css}"
      run: npx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
commit-msg:
  jobs:
    - name: commitlint
      run: npx --no-install commitlint --edit {1}
pre-push:
  jobs:
    - name: node:test
      run: npm test
