name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  commits:
    uses: ./.github/workflows/commitlint.yml
  node:
    uses: ./.github/workflows/stack-node.yml
    with:
      node-versions: '["22","24"]'
      os: '["ubuntu-latest","windows-latest"]'
      package-manager: npm
      install-command: npm ci
      cache: npm
      scripts: '["typecheck","lint","test","build","standard"]'
