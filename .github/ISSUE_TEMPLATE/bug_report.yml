# Managed by repokit (https://github.com/vannt-dev/repokit). Edits are reported by `repokit check`.
name: Bug report
description: Report something that does not work as expected
labels:
  - bug
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the steps to reproduce it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
